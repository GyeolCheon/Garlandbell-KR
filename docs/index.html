  <script type="text/javascript">
    /* 다크/라이트 테마 토글 (시안 3). localStorage에 저장. */
    (function () {
      // 저장된 테마를 렌더 전에 먼저 적용 (깜빡임 방지)
      try {
        if (localStorage.getItem('gb-theme') === 'light' && document.body) {
          document.body.classList.add('light');
        }
      } catch (e) {}

      // 토글은 #main-template 안에 있어 재렌더(레이아웃 전환 등)마다 새로 생성됨
      // → document 위임으로 처리해야 리스너가 유실되지 않음
      function syncToggleAria(el) {
        if (el) el.setAttribute('aria-checked', document.body.classList.contains('light') ? 'true' : 'false');
      }
      function toggleTheme(el) {
        var light = document.body.classList.toggle('light');
        try { localStorage.setItem('gb-theme', light ? 'light' : 'dark'); } catch (e2) {}
        syncToggleAria(el);
      }
      document.addEventListener('click', function (e) {
        var t = e.target && e.target.closest && e.target.closest('#theme-toggle');
        if (t) toggleTheme(t);
      });
      // 키보드 조작: Enter/Space로 토글·버튼 활성화 (Space 기본 스크롤 방지)
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar' && e.keyCode !== 13 && e.keyCode !== 32) return;
        if (!e.target || !e.target.closest) return;
        var t = e.target.closest('#theme-toggle');
        if (t) { e.preventDefault(); toggleTheme(t); return; }
        var btn = e.target.closest('#alarm-toggle, #mode-toggle, #settings-toggle');
        if (btn) { e.preventDefault(); btn.click(); }
      });
      // 스크린리더가 포커스 시 현재 상태(다크/라이트)를 읽도록 동기화 (재렌더 후 포함)
      document.addEventListener('focusin', function (e) {
        var t = e.target && e.target.closest && e.target.closest('#theme-toggle');
        if (t) syncToggleAria(t);
      });

      // 모든 이미지에 alt 부여 (접근성/SEO). title 있으면 그 값, 없으면 장식용 alt="".
      // 명시적 alt/aria-label/role 이 있는 이미지는 건드리지 않음.
      function enhanceAlt(scope) {
        var imgs = (scope || document).querySelectorAll('img:not([alt])');
        for (var i = 0; i < imgs.length; i++) {
          var im = imgs[i];
          if (im.getAttribute('aria-label') || im.getAttribute('role')) continue;
          var ti = im.getAttribute('title');
          im.setAttribute('alt', ti || '');
        }
      }
      enhanceAlt(document);
      // 타이머 카드는 필터/레이아웃 전환 때 다시 그려지므로 새로 추가된 노드도 처리
      try {
        var altObserver = new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            if (muts[i].addedNodes && muts[i].addedNodes.length) { enhanceAlt(document); break; }
          }
        });
        if (document.body) altObserver.observe(document.body, { childList: true, subtree: true });
      } catch (e3) {}
    })();
  </script>
